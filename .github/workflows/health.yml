name: 看板健康检查

# 每天北京时间 04:00 体检一次。异常时以退出码 1 结束，运行历史里会标红。
# 通知功能已于 2026-09-12 下线，不再推送微信。
on:
  schedule:
    - cron: '0 20 * * *'      # UTC 20:00 = 北京时间次日 04:00
  workflow_dispatch: {}

env:
  TZ: Asia/Shanghai

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行检查
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FALLBACK_URL: ${{ vars.FALLBACK_URL }}
          MIRROR_URL: ${{ vars.MIRROR_URL }}
          DOMAIN_EXPIRY: ${{ vars.DOMAIN_EXPIRY }}
        run: node tools/health_site.js
