name: 探测（临时）

# 临时探测脚本：验证 GitHub Actions 海外 runner 能否访问本系统依赖的国内数据源。
# 结论取出后即删除本文件。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测国内数据源可达性
        run: |
          set +e
          probe () {
            local name="$1" url="$2"
            local out
            out=$(curl -sSL -o /dev/null --max-time 25 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              -w "%{http_code}|%{time_total}|%{size_download}" "$url" 2>&1)
            printf '%-28s %s\n' "$name" "$out"
          }
          echo "===== 站点可达性（状态码|耗时秒|下载字节）====="
          probe "jiuyangongshe-主页"  "https://www.jiuyangongshe.com/u/df07647c21594f8c9c382304128c08f3/"
          probe "jiuyangongshe-文"    "https://www.jiuyangongshe.com/"
          probe "tgb-湖南人博客"       "https://m.tgb.cn/blog/444409"
          probe "tgb-行鱼博客"         "https://m.tgb.cn/blog/563404"
          probe "tgb-图片CDN"          "https://image.tgb.cn/"
          probe "sctapi-Server酱"      "https://sctapi.ftqq.com/"
          probe "东财-push2his"        "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.600000&fields1=f1&fields2=f51,f53&klt=101&fqt=1&end=20500101&lmt=2"
          probe "东财-push2delay"      "https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=5&fs=m:0+t:6&fields=f12,f14"
          probe "新浪-hq"              "https://hq.sinajs.cn/list=sh600000"
          probe "腾讯-qt"              "https://qt.gtimg.cn/q=sh600000"

          echo ""
          echo "===== 内容抽取（验证非空且为真页面）====="
          curl -sSL --max-time 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0" \
            "https://www.jiuyangongshe.com/u/df07647c21594f8c9c382304128c08f3/" -o /tmp/jy.html
          echo "韭研公社HTML字节数: $(wc -c < /tmp/jy.html)"
          echo "含文章链接 /a/ 次数: $(grep -o '/a/' /tmp/jy.html | wc -l)"
          echo "--------- 头部 300 字节 ---------"
          head -c 300 /tmp/jy.html
          echo ""
          echo "--------- 匹配到的文章ID样本 ---------"
          grep -oE '"/a/[A-Za-z0-9]+"' /tmp/jy.html | head -5

          curl -sSL --max-time 25 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15" \
            "https://m.tgb.cn/blog/444409" -o /tmp/tgb.html
          echo ""
          echo "淘股吧HTML字节数: $(wc -c < /tmp/tgb.html)"
          echo "含复盘关键词次数: $(grep -o '复盘' /tmp/tgb.html | wc -l)"

          echo ""
          echo "===== 出口 IP 归属 ====="
          curl -s --max-time 15 https://ipinfo.io/json || echo "(ipinfo 失败)"
