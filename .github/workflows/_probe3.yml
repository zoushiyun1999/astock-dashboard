name: 探测3（临时）

on:
  push:
    paths:
      - '.github/workflows/_probe3.yml'
  workflow_dispatch:

jobs:
  probe3:
    runs-on: ubuntu-latest
    steps:
      - name: 验证图片下载链路（AI读图前提）
        run: |
          set +e
          UA_M='Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1'
          UA_D='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'

          echo "===== 1. 取湖南人最新帖链接 ====="
          curl -sSL --max-time 30 -A "$UA_M" -H 'Referer: https://m.tgb.cn/' \
            'https://m.tgb.cn/blog/444409' -o /tmp/blog.html
          echo "博客页字节数: $(wc -c < /tmp/blog.html)"
          POST=$(grep -oE 'href="/a/[A-Za-z0-9]+"' /tmp/blog.html | head -1 | grep -oE '/a/[A-Za-z0-9]+')
          echo "抓到的首个文章链接: ${POST:-(未抓到)}"

          if [ -z "$POST" ]; then
            echo "!! 未抓到文章链接，尝试备用匹配"
            grep -oE '/a/[A-Za-z0-9]{6,}' /tmp/blog.html | head -5
          else
            echo ""
            echo "===== 2. 下载文章页并提取图片URL ====="
            curl -sSL --max-time 30 -A "$UA_M" -H 'Referer: https://m.tgb.cn/' \
              "https://m.tgb.cn$POST" -o /tmp/art.html
            echo "文章页字节数: $(wc -c < /tmp/art.html)"
            echo "含 image.tgb.cn 次数: $(grep -o 'image\.tgb\.cn' /tmp/art.html | wc -l)"
            echo "--- 图片URL样本 ---"
            grep -oE 'https://image\.tgb\.cn/[^"'"'"' )]+' /tmp/art.html | sort -u | head -6

            IMG=$(grep -oE 'https://image\.tgb\.cn/[^"'"'"' )]+' /tmp/art.html | sort -u | head -1)
            if [ -n "$IMG" ]; then
              echo ""
              echo "===== 3. 实际下载一张图片 ====="
              echo "URL: $IMG"
              curl -sSL --max-time 40 -A "$UA_M" -H 'Referer: https://m.tgb.cn/' \
                "$IMG" -o /tmp/pic.bin -w 'http=%{http_code} bytes=%{size_download} time=%{time_total}\n'
              echo "文件类型: $(file -b /tmp/pic.bin)"
              echo "文件大小: $(wc -c < /tmp/pic.bin) 字节"
            else
              echo "!! 未提取到图片URL"
            fi
          fi

          echo ""
          echo "===== 4. 投资日历（韭研公社）图片下载 ====="
          curl -sSL --max-time 30 -A "$UA_D" -H 'Referer: https://www.jiuyangongshe.com/' \
            'https://www.jiuyangongshe.com/u/648089de4f1649de9e18b8285faca8b8' -o /tmp/cal.html
          echo "主页字节数: $(wc -c < /tmp/cal.html)"
          CAL=$(grep -oE '"/a/[A-Za-z0-9]+"' /tmp/cal.html | head -1 | grep -oE '/a/[A-Za-z0-9]+')
          echo "首个文章: ${CAL:-(未抓到)}"
          if [ -n "$CAL" ]; then
            curl -sSL --max-time 30 -A "$UA_D" -H 'Referer: https://www.jiuyangongshe.com/' \
              "https://www.jiuyangongshe.com$CAL" -o /tmp/calart.html
            echo "文章页字节数: $(wc -c < /tmp/calart.html)"
            echo "含 cdn.jiuyangongshe.com 次数: $(grep -o 'cdn\.jiuyangongshe\.com' /tmp/calart.html | wc -l)"
            CIMG=$(grep -oE 'cdn\.jiuyangongshe\.com[^"'"'"' \\]+' /tmp/calart.html | sort -u | head -3)
            echo "--- 图片URL样本 ---"
            echo "$CIMG"
            FIRST_CIMG=$(echo "$CIMG" | head -1 | sed 's|\\u002F|/|g')
            if [ -n "$FIRST_CIMG" ]; then
              URL="https://$FIRST_CIMG"
              echo "尝试下载: $URL"
              curl -sSL --max-time 40 -A "$UA_D" -H 'Referer: https://www.jiuyangongshe.com/' \
                "$URL" -o /tmp/cal.jpg -w 'http=%{http_code} bytes=%{size_download}\n'
              echo "文件类型: $(file -b /tmp/cal.jpg)"
            fi
          fi
