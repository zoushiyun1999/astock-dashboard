name: 量价选股（技术面筛选）

on:
  # ⚠️ 目前仅支持手动触发。原因：
  #   · 自动调度（cron）会因 GitHub cron 延迟而错过 14:30 开盘时段
  #   · 且原逻辑直接 push 回仓库，会与本机的自动同步钩子冲突
  # 当前由本机定时任务负责生成，push 后经「发布看板」上线。
  # 未来若把生成也搬到云端，再取消下面三行注释并改造提交逻辑。
  # schedule:
  #   - cron: '30 6 * * 1-5'      # 北京时间 14:30 = UTC 06:30，周一至周五
  workflow_dispatch: {}            # 手动触发（测试 / 补跑）

# 推送回仓库 + 部署 GitHub Pages 所需权限
permissions:
  contents: write
  pages: write
  id-token: write

# 防止并发 push 冲突：同一时刻只跑一个
concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screener:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行选股（捕获输出以判断非交易日）
        run: |
          OUT=$(node tools/screener.js 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -qE "全市场（沪深主板）：0 只|最终入选 0 只"; then
            echo "skip=1" >> "$GITHUB_ENV"
          else
            echo "skip=0" >> "$GITHUB_ENV"
          fi

      - name: 刷新前端版本号
        if: env.skip != '1'
        run: bash tools/bump_version.sh

      - name: 提交数据回仓库
        if: env.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.js dashboard/screener.js dashboard/index.html
          git commit -m "量价选股 $(date +%Y-%m-%d) [skip ci]" || echo "无变化"
          git push

      - name: 上传 Pages 产物（仅 dashboard 目录）
        if: env.skip != '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: 部署到 GitHub Pages
        id: deploy
        if: env.skip != '1'
        uses: actions/deploy-pages@v4

      - name: 微信通知（Server酱）
        if: env.skip != '1' && success()
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: |
          INFO=$(node -e "const fs=require('fs');const s=fs.readFileSync('dashboard/data.js','utf8');eval(s.replace('window.REPORTS =','global.R='));const list=(R.screener&&R.screener.list)||[];const top=list.slice(0,5).map(x=>x.name+'('+x.gain+'%)').join('、');console.log(list.length+'|'+top);")
          COUNT=$(echo "$INFO" | cut -d'|' -f1)
          TOP=$(echo "$INFO" | cut -d'|' -f2)
          DESP=$(printf '今日技术面筛选完成，共 %s 只符合条件。\n\n前 5 只：%s\n\n🔗 看板链接：%s\n\n—— 由 GitHub Actions 自动推送' "$COUNT" "$TOP" "${{ steps.deploy.outputs.page_url }}")
          curl -s --max-time 20 -X POST "https://sctapi.ftqq.com/${SCT_KEY}.send" \
            --data-urlencode "title=🔍 量价选股已更新（$(date +%Y-%m-%d)）" \
            --data-urlencode "desp=${DESP}"
