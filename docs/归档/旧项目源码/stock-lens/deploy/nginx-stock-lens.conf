# stock-lens —— 静态页面 + 访问口令
# 放在 /etc/nginx/sites-available/stock-lens，由 setup-server.sh 软链到 sites-enabled

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/stock-lens/web;
    index index.html;

    # 个人自用但暴露在公网，加一道口令。没有这道，任何人扫到端口都能看。
    auth_basic           "stock-lens";
    auth_basic_user_file /etc/nginx/.htpasswd-stocklens;

    # 页面和数据都必须不缓存：
    # 每天 18:10 更新后，手机上刷新要立刻看到新数据，不能拿浏览器的旧缓存。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /data.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 顺手压缩，手机流量省一点
    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript;

    # 只读静态站，不需要上传体积，收紧一点
    client_max_body_size 1m;

    access_log /var/log/nginx/stock-lens.access.log;
    error_log  /var/log/nginx/stock-lens.error.log;
}
