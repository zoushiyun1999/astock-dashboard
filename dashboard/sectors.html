<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>热点板块 · A股速览</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="热点板块">
<link rel="stylesheet" href="css/style.css?v=202609241234">
<style>
/* ── 独立页专属样式（sp- 前缀防冲突；卡片/板块卡复用 style.css 的 .card/.sector 系列） ──
   配色：浅色阅读主题 —— 主看板头部是深色渐变+白字，本页标题曾误用深色变量导致看不清。
   独立页整体覆写为「白底头部 + 高对比正文」，覆写只作用于本页，不影响主看板。 */
body { padding-bottom: 24px; }

/* ── 头部：直接继承 style.css 的 iOS 磨砂浅头部（2026-09-22 双页统一），不再覆写 ── */
.sp-header { position: sticky; top: 0; z-index: 30; }
/* 三行归位（与主看板同构）：品牌行两端对齐（品牌靠左 / 日期靠右）+ 控制行。
   边距统一走 --gutter，与主看板共用同一条左右轴。 */
.sp-headbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; min-height: var(--ctl-h);
}
.sp-brand { display: flex; align-items: center; gap: 8px; }
/* 品牌标识：与主看板同款**纯色 monogram 方块**（主看板是「A」，这里是「热」）+ 新拟态微凸。 */
.sp-logo {
  width: 30px; height: 30px; border-radius: 9px; background: var(--brand);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-md); font-weight: var(--fw-semibold); color: #fff; flex: none;
  box-shadow: -1px -1px 3px var(--nm-light), 2px 2px 5px var(--nm-dark);
}
.sp-title { font-size: var(--fs-title); font-weight: var(--fw-semibold); color: var(--ink); letter-spacing: 0; }
/* 返回主看板：复用全局 .nav-pill（见 style.css），与主看板「板块」入口同坐标同款式。
   箭头方向相反（‹ 往回），语义自明。 */
/* 日期：**并入品牌行右端**（原来独占一行且右对齐，与品牌行错位） */
.sp-date { display: flex; align-items: baseline; gap: 6px; flex: none; }
.sp-date b { font-size: var(--fs-lg); color: var(--ink); line-height: 1.2; }
.sp-date span { font-size: var(--fs-sm); color: var(--ink-2); }
/* 日期选择：与主看板日期条**同款内凹胶囊**（新拟态语言统一），
   不再是一个描边 select —— 两页的控件语言必须一致，否则互跳时「不和谐」。 */
.sp-controls { display: flex; gap: 8px; align-items: center; padding: 0 0 var(--row-gap); }
.sp-select {
  flex: 1; min-width: 0; height: var(--ctl-h);
  font-size: var(--fs-base); font-weight: var(--fw-semibold); color: var(--ink);
  background: var(--bg); border: none;
  border-radius: var(--radius-md); padding: 0 var(--sp-3);
  box-shadow: var(--nm-inset-sm);
  appearance: none; -webkit-appearance: none;
  font-variant-numeric: tabular-nums;
}
.sp-summary { max-width: 560px; margin: 0 auto; padding: 0 14px 10px; font-size: var(--fs-sm); color: var(--ink-2); }
.sp-main { padding: 0 14px; max-width: 560px; margin: 0 auto; }

/* ── 板块卡：白底 + 发丝描边 + 新拟态双向柔光（与主看板 .card 同款，两页共用一条光照）。
       不覆写 box-shadow —— 两页必须共用同一个 --nm-raise-sm，否则并排看会「不和谐」。 ── */
.sector {
  background: #fff;
  border-color: var(--line-2);
  padding: 12px 12px 12px;
}
.sector .stocks { margin-top: 8px; line-height: 1.7; letter-spacing: .2px; }
.sector .cat { margin-top: 7px; line-height: 1.65; }

/* 强度行：它是一整句话，**不该装进胶囊**（长文本 + 彩色底 + 描边 = 噪音最重的元素）。
   改「左侧琥珀细规 + 常规文字」，既保留语义色的提示，又让数据行回到视觉主体。 */
.sp-st {
  display: block; margin-top: 7px; font-size: var(--fs-xs); font-weight: var(--fw-medium);
  color: var(--ink-2); line-height: 1.6;
  padding-left: 9px; border-left: 2px solid var(--amber-raw);
}
/* 连续上榜徽章：去掉描边（小徽章加边框只会显脏），只留浅底 + 语义文字色 */
.sp-streak {
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: #8A5300;
  background: #FDF6E7; padding: 2px 8px; border-radius: var(--radius-pill, 99px);
  white-space: nowrap;
}
.sp-streak.cold { color: var(--ink-2); background: var(--brand-soft); }
/* 板块卡内近5期统计 */
.sp-heat5 { font-size: var(--fs-xs); color: var(--ink-2); padding: 3px 0 0; }
.sp-empty {
  padding: 28px 16px; text-align: center; color: var(--ink-2); font-size: var(--fs-sm);
}
.sp-empty b { display: block; font-size: var(--fs-base); color: var(--ink); margin-bottom: 6px; }
.sp-foot { text-align: center; padding: 18px 0 6px; font-size: var(--fs-xs); }
.sp-foot a { color: var(--ink-2); text-decoration: none; border-bottom: 1px dashed currentColor; }
.sp-tip { max-width: 560px; margin: 0 auto; padding: 10px 14px 0; font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.6; }
</style>
</head>
<body>

<header class="sp-header">
  <div class="h-inner">
    <div class="sp-headbar">
      <!-- 品牌：与主看板「[A] 股速览」同构 —— **首字进深色方块**，余字作标题。
           整行连读即「热点板块」（2026-09-23 用户选定方案 A）。 -->
      <div class="sp-brand">
        <span class="sp-logo">热</span>
        <span class="sp-title">点板块</span>
      </div>
      <!-- 日期并入品牌行右端（三行归位，与主看板同构） -->
      <div class="sp-date"><b id="hdDate">—</b><span id="hdWeek">—</span></div>
    </div>
    <!-- 第二行：返回主看板（与主看板「板块」入口同坐标同款式） -->
    <div class="sp-controls">
      <a class="nav-pill" href="index.html"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>主页</a>
      <select class="sp-select" id="dateSel" aria-label="选择日期"></select>
    </div>
  </div>
</header>

<div class="sp-summary" id="spSummary"></div>
<main class="sp-main" id="app"></main>
<div class="sp-tip" id="spTip" hidden>「连续 N 期」按出现板块热点的期数连续计（中间缺晚报的日期自动跳过不断档）；徽标灰显 = 上榜不足 2 期。</div>
<footer class="sp-foot"><a href="index.html">← 返回主看板</a></footer>

<script>
(function () {
  'use strict';
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function weekOf(ds) {
    var d = new Date(ds + 'T00:00:00');
    return isNaN(d) ? '' : '周' + '日一二三四五六'.charAt(d.getDay());
  }

  function boot() {
  var reports = (window.REPORTS && window.REPORTS.reports) || [];

  // 只关心「有板块热点数据」的期：{ds, list, map}
  var secDates = [];
  // 全部期日期（用于无数据时给出准确原因）
  var allDates = {};
  reports.forEach(function (r) {
    allDates[r.date] = r;
    var list = r.evening && r.evening['板块热点'];
    if (list && list.length) {
      var map = {};
      list.forEach(function (x) { if (x && x.name) map[x.name] = x; });
      secDates.push({ ds: r.date, list: list, map: map });
    }
  });
  // 升序排列（reports 本身 newest-at-bottom，但按 date 排序兜底）
  secDates.sort(function (a, b) { return a.ds < b.ds ? -1 : 1; });

  var sel = document.getElementById('dateSel');
  var app = document.getElementById('app');
  var hdDate = document.getElementById('hdDate');
  var hdWeek = document.getElementById('hdWeek');
  var summary = document.getElementById('spSummary');

  // ── 日期下拉：有板块数据的期在前（标 ●），其余期在后，最新在前 ──
  var options = [];
  reports.slice().reverse().forEach(function (r) { options.push(r.date); });
  Object.keys(allDates).forEach(function (ds) { if (options.indexOf(ds) < 0) options.push(ds); });
  options.sort(function (a, b) { return a < b ? 1 : -1; });
  var hasData = {};
  secDates.forEach(function (x) { hasData[x.ds] = true; });
  sel.innerHTML = options.map(function (ds) {
    // 显示去年份（与主看板日期条同口径：09/21 而非 2026-09-21）——
    // 两页互跳时日期写法必须一致，否则并排看「不和谐」。年份在 value 里保留。
    var md = String(ds).slice(5).replace('-', '/');
    return '<option value="' + ds + '"' + (hasData[ds] ? '' : ' disabled') + '>' +
      md + ' ' + weekOf(ds) + (hasData[ds] ? '' : ' · 无晚报') + '</option>';
  }).join('');
  // 默认选中：最新一期有板块数据的日期；一个都没有 → 全部禁用
  var def = secDates.length ? secDates[secDates.length - 1].ds : null;

  function streakStats(name, p) {
    // p = 所选日期在 secDates 中的下标。连续期数：中间「没有板块数据的期」被整体排除在
    // secDates 之外（天然跳过、不断档），一旦某期有板块数据但没有该板块 → 断。
    // last5 = 含本期在内最近 5 期板块数据中上榜次数。
    var streak = 0, last5 = 0;
    for (var j = p; j >= 0; j--) {
      if (secDates[j].map[name]) {
        streak++;
        if (p - j < 5) last5++;
      } else break;
    }
    return { streak: streak, last5: last5 };
  }

  function render(ds) {
    var _p = ds.split('-');
    hdDate.textContent = (+_p[1]) + '月' + (+_p[2]) + '日';   // 不显示年份（2026-09-23 用户要求）
    hdDate.title = ds;
    hdWeek.textContent = weekOf(ds);
    var r = allDates[ds];

    if (!r) {
      summary.textContent = '';
      app.innerHTML = '<div class="sp-empty"><b>' + esc(ds) + ' 无简报数据</b>休市日，或该日早报/晚报任务未运行（历史缺口）。</div>';
      return;
    }
    var ev = r.evening;
    if (!ev) {
      summary.textContent = '';
      app.innerHTML = '<div class="sp-empty"><b>' + esc(ds) + ' 晚报未产出</b>当日两位博主均未发帖，或晚报任务未运行 —— 没有板块热点可展示。</div>';
      return;
    }
    var list = ev['板块热点'];
    if (!list || !list.length) {
      summary.textContent = '';
      app.innerHTML = '<div class="sp-empty"><b>' + esc(ds) + ' 当期无板块热点</b>晚报已产出，但该期未提取到板块热点数据。</div>';
      return;
    }

    var p = -1;
    for (var i = 0; i < secDates.length; i++) if (secDates[i].ds === ds) { p = i; break; }

    summary.textContent = '共 ' + list.length + ' 个板块 · 数据来自 ' + ds + ' 晚报（博主复盘提炼）';

    app.innerHTML = '<div class="card"><h3 data-dot="rank3"><span class="dot"></span>板块热点（按强度排序）</h3>' +
      list.map(function (x, i) {
        var st = (p >= 0 && x.name) ? streakStats(x.name, p) : { streak: 1, last5: 1 };
        var badge = st.streak >= 2
          ? '<span class="sp-streak">连续 ' + st.streak + ' 期</span>'
          : '<span class="sp-streak cold">新上榜</span>';
        return '<div class="sector">' +
          '<div class="sc-head"><span class="rank">' + (i + 1) + '</span>' +
          '<span class="nm">' + esc(x.name) + '</span>' +
          badge +
          '</div>' +
          (x.strength ? '<div><span class="sp-st">' + esc(x.strength) + '</span></div>' : '') +
          (x.stocks ? '<div class="stocks">' + esc(x.stocks) + '</div>' : '') +
          (x.catalyst ? '<div class="cat"><b>催化</b>' + esc(x.catalyst) + '</div>' : '') +
          '<div class="sp-heat5">近 5 期上榜 ' + Math.max(st.last5, 1) + ' 次</div>' +
          '</div>';
      }).join('') + '</div>';
  }

  sel.addEventListener('change', function () { render(sel.value); });
  if (def) { sel.value = def; render(def); document.getElementById('spTip').hidden = false; }
  else {
    sel.innerHTML = '<option>暂无任何晚报数据</option>';
    sel.disabled = true;
    app.innerHTML = '<div class="sp-empty"><b>还没有数据</b>等晚报任务（每天 21:00）产出后这里自动出现板块热点。</div>';
  }
  } // boot

  // 数据动态加载：每次带时间戳请求 data.js，杜绝手机缓存旧数据
  // （主看板靠 bump_version.sh 刷 ?v=，独立页没有这个流程，自管缓存最稳）
  if (window.REPORTS) { boot(); }
  else {
    fetch('data.js?ts=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t) { (new Function(t))(); boot(); })
      .catch(function (e) {
        document.getElementById('app').innerHTML =
          '<div class="sp-empty"><b>数据加载失败</b>' + esc(e.message) + ' —— 请稍后刷新重试。</div>';
      });
  }
})();
</script>
</body>
</html>
